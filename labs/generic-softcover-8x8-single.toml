# Example profile — NOT a real lab. Single-page (perfect bound) photobook.
schema_version = 1
id = "generic-softcover-8x8-single"
name = "Generic Softcover 8x8, single pages (example)"
country = "MY"
units = "mm"
source = "example-only"
verified_at = "2026-10-25"
binding = "single_pages"

[[sizes]]
id = "8x8"
